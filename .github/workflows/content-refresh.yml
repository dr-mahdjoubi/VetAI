# VetAI Content Refresh — تحديث تلقائي لشريط الأخبار من خلاصات RSS موثوقة
# يضيف الجديد إلى json/news.json ويلتزم به؛ النشر التلقائي عند GitHub
# يدفع التحديث إلى كل المرايا (Cloudflare/Vercel/Render/Pages).
name: VetAI Content Refresh

on:
  schedule:
    - cron: '23 6 * * *'   # يوميًا ~06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh news from RSS feeds
        run: node tools/refresh-news.mjs --file json/news.json --max-new 5

      - name: Commit if changed
        run: |
          git config user.name 'vetai-content-bot'
          git config user.email 'content@vetai.local'
          git add json/news.json
          if git diff --cached --quiet; then
            echo 'لا جديد اليوم.'
          else
            git commit -m 'chore(news): تحديث تلقائي لشريط الأخبار'
            git push
          fi
