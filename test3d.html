<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetAI 3D diagnostic</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  body{font-family:system-ui;background:#0b1220;color:#e2e8f0;margin:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  figure{margin:0;background:#111c30;border:1px solid #1e293b;border-radius:12px;padding:10px}
  model-viewer{width:100%;height:260px;background:#1a2740;border-radius:8px}
  figcaption{font-size:13px;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<h1>3D load diagnostic — six isolated variants</h1>
<div class="grid">
  <figure>
    <model-viewer src="assets/3d/fox.glb" camera-controls auto-rotate alt="A"></model-viewer>
    <figcaption><b>A</b> — LOCAL meshopt-compressed Fox (assets/3d/fox.glb), plain viewer</figcaption>
  </figure>
  <figure>
    <model-viewer src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb" camera-controls auto-rotate alt="B"></model-viewer>
    <figcaption><b>B</b> — REMOTE original uncompressed Fox (Khronos), plain viewer</figcaption>
  </figure>
  <figure>
    <model-viewer src="assets/3d/horse.glb" camera-controls auto-rotate alt="C"></model-viewer>
    <figcaption><b>C</b> — LOCAL meshopt-compressed Horse (assets/3d/horse.glb), plain viewer</figcaption>
  </figure>
  <figure>
    <model-viewer src="https://threejs.org/examples/models/gltf/Horse.glb" camera-controls auto-rotate alt="D"></model-viewer>
    <figcaption><b>D</b> — REMOTE original Horse (threejs.org), plain viewer</figcaption>
  </figure>
  <figure>
    <model-viewer src="assets/3d/fox.glb" environment-image="assets/3d/env-sky.hdr" camera-controls auto-rotate alt="E"></model-viewer>
    <figcaption><b>E</b> — LOCAL meshopt Fox + HDR environment-image (env-sky.hdr)</figcaption>
  </figure>
  <figure>
    <model-viewer src="assets/3d/dog.glb" camera-controls auto-rotate alt="F"></model-viewer>
    <figcaption><b>F</b> — LOCAL meshopt-compressed Dog (assets/3d/dog.glb, the theater file), plain viewer</figcaption>
  </figure>
</div>
</body>
</html>
