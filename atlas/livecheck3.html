<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LiveCheck3 — running…</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220}
  #fr{position:fixed;inset:0;width:100%;height:100%;border:0}
  #bar{position:fixed;top:0;left:0;right:0;z-index:9;background:rgba(5,10,20,.92);color:#7dd3fc;
       font:12px monospace;padding:6px 10px;white-space:nowrap;overflow:hidden}
  #panel{position:fixed;inset:0;z-index:10;background:#0b1220;color:#dbeafe;display:none;
       font:13px/1.7 monospace;padding:16px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div id="bar">probe3 booting…</div>
<iframe id="fr" src="/atlas/"></iframe>
<div id="panel"></div>
<script>
var lines = [];
var bar = document.getElementById('bar');
var t0 = Date.now();
function log(m) {
  var s = '[' + ((Date.now() - t0) / 1000).toFixed(1) + 's] ' + m;
  lines.push(s); bar.textContent = s;
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function waitFor(fn, timeout, stepMs) {
  return new Promise(async function (resolve) {
    var end = Date.now() + timeout;
    while (Date.now() < end) {
      var v = false; try { v = fn(); } catch (e) {}
      if (v) return resolve(v);
      await sleep(stepMs || 400);
    }
    resolve(null);
  });
}
(async function () {
  log('probe3: parent visible=' + !document.hidden + ' visState=' + document.visibilityState);
  var fr = document.getElementById('fr');
  var W = await waitFor(function () {
    var d = fr.contentDocument;
    return d && d.querySelectorAll('.card').length >= 12 ? fr.contentWindow : null;
  }, 40000);
  if (!W) { log('FAIL: atlas cards never appeared'); return finish(); }
  var D = W.document;
  log('cards OK | iframe visState=' + D.visibilityState + ' hidden=' + D.hidden);
  D.getElementById('jumpAnimal').value = '43';
  D.getElementById('jumpAnimalBtn').click();
  await waitFor(function () { return D.querySelector('.modal.open .sheet h2'); }, 10000);
  var tabs = D.querySelectorAll('.sheet .tab'), clicked = false;
  tabs.forEach(function (t) { if (t.textContent.indexOf('3D') !== -1) { t.click(); clicked = true; } });
  log('3D tab clicked=' + clicked);
  var mv = await waitFor(function () { return D.querySelector('.sheet model-viewer'); }, 10000);
  if (!mv) { log('FAIL: no model-viewer created'); return finish(); }
  // visibility instrumentation inside the iframe
  var inter = 'unknown';
  try {
    var io = new W.IntersectionObserver(function (es) { inter = es[0].isIntersecting + ' ratio=' + es[0].intersectionRatio.toFixed(2); }, { threshold: [0, 0.25, 0.5, 1] });
    io.observe(mv);
  } catch (e) { inter = 'IO error ' + e.message; }
  var loadedAt = -1;
  for (var i = 0; i < 20; i++) {
    await sleep(2000);
    var r = mv.getBoundingClientRect();
    log('poll ' + (i + 1) + ': loaded=' + mv.loaded + ' inter=' + inter +
        ' rect=' + Math.round(r.width) + 'x' + Math.round(r.height) + '@' + Math.round(r.top) +
        ' vis=' + D.visibilityState + ' poster=' + (mv.getAttribute('poster') ? 'set' : 'none') +
        ' src=' + (mv.getAttribute('src') || '').slice(-30));
    if (mv.loaded) { loadedAt = (i + 1) * 2; break; }
  }
  log(loadedAt > 0 ? ('RESULT: ATLAS HORSE LOADED in ~' + loadedAt + 's inside visible iframe') : 'RESULT: atlas horse NOT loaded after 40s of polling');
  finish();
  function finish() {
    var p = document.getElementById('panel');
    p.style.display = 'block';
    p.textContent = 'VetAI LiveCheck3 results\n' + lines.join('\n') + '\nPROBE3 COMPLETE';
    document.title = 'LiveCheck3 DONE';
  }
})();
</script>
</body>
</html>
