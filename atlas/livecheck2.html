<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LiveCheck2 — running…</title>
<style>body{background:#0b1220;color:#dbeafe;font-family:monospace;padding:16px}pre{white-space:pre-wrap;line-height:1.7;font-size:13px}iframe{width:100%;height:520px;border:1px solid #335}</style>
</head>
<body>
<h3>VetAI LiveCheck2 — drives the REAL deployed /atlas/ page in an iframe and reports its internal state</h3>
<pre id="out">starting…</pre>
<iframe id="fr" src="/atlas/"></iframe>
<script>
var out = document.getElementById('out');
var t0 = Date.now();
function log(m) { out.textContent += '\n[' + ((Date.now() - t0) / 1000).toFixed(1) + 's] ' + m; }
out.textContent = 'probe2 started';
function waitFor(fn, timeout, label) {
  return new Promise(function (resolve) {
    var iv = setInterval(function () {
      var v = false;
      try { v = fn(); } catch (e) {}
      if (v) { clearInterval(iv); resolve(v); }
    }, 400);
    setTimeout(function () { clearInterval(iv); log('TIMEOUT waiting: ' + label); resolve(null); }, timeout);
  });
}
(async function () {
  var fr = document.getElementById('fr');
  var W = await waitFor(function () {
    var d = fr.contentDocument;
    return d && d.querySelectorAll('.card').length >= 12 ? fr.contentWindow : null;
  }, 40000, 'atlas cards in iframe');
  if (!W) { log('atlas iframe never produced 12 cards'); document.title = 'LiveCheck2 DONE'; return; }
  var D = W.document;
  log('iframe atlas cards OK. Animal3D in iframe: ' + (typeof W.Animal3D) +
      ' | libStatus=' + (W.Animal3D ? W.Animal3D.state.libStatus : 'n/a') +
      ' | mv registered in iframe: ' + !!(W.customElements && W.customElements.get('model-viewer')));
  // open animal 43
  D.getElementById('jumpAnimal').value = '43';
  D.getElementById('jumpAnimalBtn').click();
  var modal = await waitFor(function () { return D.querySelector('.modal.open .sheet h2') ? true : null; }, 10000, 'modal open');
  log('modal opened: ' + !!modal + ' title=' + (D.querySelector('.sheet h2') || {}).textContent);
  // click the 3D tab
  var tabs = D.querySelectorAll('.sheet .tab');
  var clicked = false;
  tabs.forEach(function (t) { if (t.textContent.indexOf('3D') !== -1) { t.click(); clicked = true; } });
  log('3D tab clicked: ' + clicked);
  var mv = await waitFor(function () { return D.querySelector('.sheet model-viewer'); }, 10000, 'mv in sheet');
  log('model-viewer in sheet: ' + !!mv);
  // observe state for 30s
  for (var i = 0; i < 10; i++) {
    await new Promise(function (r) { setTimeout(r, 3000); });
    mv = D.querySelector('.sheet model-viewer');
    if (!mv) { log('mv disappeared'); break; }
    log('t+' + (i + 1) * 3 + 's: src=' + (mv.getAttribute('src') || '').slice(-45) +
        ' | loaded=' + mv.loaded + ' | shadow=' + !!mv.shadowRoot +
        ' | cls=' + mv.className + ' | mirrored=' + (mv.dataset.a3dMirrored || '-') +
        ' | fallbackBox=' + !!D.querySelector('.sheet .a3d-fallback') +
        ' | loadbar=' + !!D.querySelector('.sheet .loadbar') +
        ' | lib=' + (W.Animal3D ? W.Animal3D.state.libStatus : '?'));
    if (mv.loaded) break;
  }
  if (W.Animal3D) {
    log('Animal3D attempts: ' + JSON.stringify(W.Animal3D.state.attempts).slice(0, 600));
    log('Animal3D libSource: ' + W.Animal3D.state.libSource);
  }
  var fb = D.querySelector('.sheet .a3d-fallback');
  if (fb) log('fallback text: ' + fb.textContent.trim().slice(0, 200));
  // Experiment: fresh model-viewer in the SAME iframe document, no atlas code involved
  var mv2 = D.createElement('model-viewer');
  mv2.setAttribute('src', 'https://threejs.org/examples/models/gltf/Horse.glb');
  mv2.setAttribute('camera-controls', '');
  mv2.style.cssText = 'width:300px;height:220px';
  D.body.appendChild(mv2);
  var ok2 = await waitFor(function () { return mv2.loaded ? true : null; }, 20000, 'fresh mv load');
  log('FRESH model-viewer in iframe doc loaded Horse: ' + !!ok2 + ' (shadow=' + !!mv2.shadowRoot + ')');
  log('PROBE2 COMPLETE');
  document.title = 'LiveCheck2 DONE';
})();
</script>
</body>
</html>
