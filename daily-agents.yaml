name: Daily AI Admin Agents
on:
  schedule:
    - cron: '0 4 * * *'      # every day 04:00 UTC
  workflow_dispatch:          # manual run button
permissions:
  contents: write
concurrency: { group: vet-agents, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python agents/run_agents.py
      - name: Commit new data
        if: always()
        run: |
          git config user.name  "vetai-agents[bot]"
          git config user.email "agents@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || (git commit -m "chore(data): daily agents $(date -u +%F)" && git pull --rebase && git push)
